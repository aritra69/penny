pluginManagement {
  // Resolve the plugin through Node rather than `../node_modules`: bun hoists every package to the
  // monorepo root (bunfig.toml), so @react-native/gradle-plugin is not under apps/mobile.
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath

  gradle.ext.reactNativeGradlePlugin = reactNativeGradlePlugin
  includeBuild(reactNativeGradlePlugin)
}

plugins { id("com.facebook.react.settings") }

// The default autolinking command is `npx @react-native-community/cli config`, and npx is blocked in
// this repo (devEngines in the root package.json). Run the same CLI with node.
def reactNativeCli = providers.exec {
  workingDir(rootDir)
  commandLine("node", "--print", "require.resolve('@react-native-community/cli/build/bin.js')")
}.standardOutput.asText.get().trim()

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand(
    ["node", reactNativeCli, "config"],
    file("../"),
    files("../package.json", "../react-native.config.js", "../../../bun.lock")
  )
}

rootProject.name = 'Penny'

include ':app'
includeBuild(gradle.ext.reactNativeGradlePlugin)
